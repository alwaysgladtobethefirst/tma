name: release
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # mirror the just-published version into github packages too, purely so it
      # shows up in the repo's "packages" sidebar. github packages requires the
      # scope to match the github owner, so this publishes under a renamed copy
      # (@alwaysgladtobethefirst/tma) - the real package stays @skrynnyk/tma on npm.
      - if: steps.changesets.outputs.published == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alwaysgladtobethefirst'
      - if: steps.changesets.outputs.published == 'true'
        run: |
          npm pkg set name=@alwaysgladtobethefirst/tma
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
